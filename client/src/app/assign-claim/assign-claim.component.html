<div class="container mt-4">
  <h2 class="text-center mb-4">Assign Claim</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

    <!-- Select Claim (ONLY UNDER_PROGRESS claims should appear here) -->
    <div class="mb-3">
      <label>Select Claim</label>
      <select class="form-select" formControlName="claimId">
        <option value="" disabled selected>Select Claim</option>

        <option *ngFor="let claim of claimList" [value]="claim.id">
          {{ claim.description }} ({{ claim.status }})
        </option>
      </select>

      <small class="text-muted">
         <b></b> 
      </small>
    </div>

    <!-- Select Investigator -->
    <div class="mb-3">
      <label>Select Investigator</label>
      <select class="form-select" formControlName="investigatorId">
        <option value="" disabled selected>Select Investigator</option>

        <option *ngFor="let inv of investigatorList" [value]="inv.id">
          {{ inv.username }}
        </option>
      </select>
    </div>

    <!-- Select Underwriter -->
    <div class="mb-3">
      <label>Select Underwriter</label>
      <select class="form-select" formControlName="underwriterId">
        <option value="" disabled selected>Select Underwriter</option>

        <option *ngFor="let uw of underwriterList" [value]="uw.id">
          {{ uw.username }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-success w-100">
      Assign Claim
    </button>
  </form>

  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <div *ngIf="showMessage" class="alert alert-success mt-3">
    {{ responseMessage }}
  </div>

  <!-- Helpful empty message -->
  <div *ngIf="claimList.length === 0" class="alert alert-info mt-3">
    No UNDER_PROGRESS claims available for assignment.
  </div>
</div>
