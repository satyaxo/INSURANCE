<div class="container mt-4">
  <h2 class="text-center mb-4">Create Claim</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label>Description</label>
      <input
        type="text"
        class="form-control"
        formControlName="description"
      />
    </div>

    <div class="mb-3">
      <label>Date</label>
      <input
        type="date"
        class="form-control"
        formControlName="date"
      />
    </div>
   <!-- ✅ ADD FILE UPLOAD HERE -->
    <div class="mb-3">
      <label class="form-label">Upload Documents</label>
      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
        multiple
        accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
      />
      <small class="text-muted">Accepted: PDF, JPG, PNG, DOC (Max 5MB each)</small>
    </div>

    <!-- ✅ SHOW SELECTED FILES LIST -->
    <ul class="list-group mb-3" *ngIf="selectedFiles.length > 0">
      <li
        *ngFor="let file of selectedFiles"
        class="list-group-item d-flex justify-content-between align-items-center"
      >
        📄 {{ file.name }}
        <span class="text-muted">({{ (file.size / 1024).toFixed(1) }} KB)</span>
        <button
          type="button"
          class="btn btn-sm btn-danger"
          (click)="removeFile(file)"
        >Remove</button>
      </li>
    </ul>
    <button type="submit" class="btn btn-primary w-100">
      Create Claim
    </button>
  </form>

  <!-- ✅ Success Popup -->
  <div *ngIf="showMessage" class="alert alert-success mt-3">
    {{ responseMessage }}
  </div>

  <!-- ❌ Error Popup -->
  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
