<div class="container mt-4">
  <h2 class="text-center mb-4">Investigator Report</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="needs-validation">
    <div class="form-group mb-3">
      <label for="report">Report</label>
      <textarea id="report" formControlName="report" class="form-control"></textarea>
    </div>

    <div class="form-group mb-3">
      <label for="status">Status</label>
      <select id="status" formControlName="status" class="form-select">
        <option value="" disabled>Select Status</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      {{ updateId ? 'Update Investigation' : 'Create Investigation' }}
    </button>
  </form>

  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <div *ngIf="showMessage" class="alert alert-success mt-3">
    {{ responseMessage }}
  </div>

  <h3 class="mt-4">Investigations</h3>
  <ul class="list-group">
    <li *ngFor="let inv of investigationList" class="list-group-item d-flex justify-content-between align-items-center">
      <span>{{ inv.report }} - {{ inv.status }}</span>
      <button class="btn btn-sm btn-secondary" (click)="edit(inv)">Edit</button>
    </li>
  </ul>
</div>
