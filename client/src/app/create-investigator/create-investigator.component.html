<div class="container mt-4">
  <h2 class="text-center mb-4">Investigator Report</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="needs-validation">

    <!-- ✅ NEW: Select Assigned Claim -->
    <div class="form-group mb-3">
      <label for="claimId">Select Assigned Claim</label>
      <select
        id="claimId"
        formControlName="claimId"
        class="form-select"
      >
        <option value="" disabled>Select Claim</option>
        <option *ngFor="let claim of assignedClaims" [value]="claim.id">
          {{ claim.description }} ({{ claim.status }})
        </option>
      </select>
    </div>

    <!-- Report -->
    <div class="form-group mb-3">
      <label for="report">Report</label>
      <textarea
        id="report"
        formControlName="report"
        class="form-control"
      ></textarea>
    </div>

    <!-- Status -->
    <div class="form-group mb-3">
      <label for="status">Status</label>
      <select
        id="status"
        formControlName="status"
        class="form-select"
      >
        <option value="" disabled>Select Status</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      {{ updateId ? 'Update Investigation' : 'Create Investigation' }}
    </button>
  </form>

  <!-- Error Message -->
  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <!-- Success Message -->
  <div *ngIf="showMessage" class="alert alert-success mt-3">
    {{ responseMessage }}
  </div>

  <!-- Investigation List -->
  <h3 class="mt-4">Investigations</h3>
  <ul class="list-group">
    <li
      *ngFor="let inv of investigationList"
      class="list-group-item d-flex justify-content-between align-items-center"
    >
    
<strong>Claim:</strong>
{{ inv.claim?.description || 'Claim not linked' }} <br>
<strong>Status:</strong> {{ inv.status }}


      <button
        class="btn btn-sm btn-secondary"
        (click)="edit(inv)"
      >
        Edit
      </button>
    </li>
  </ul>
</div>
