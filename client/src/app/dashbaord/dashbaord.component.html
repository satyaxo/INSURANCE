<div class="container mt-4">
  <h2 class="text-center mb-4">Dashboard</h2>

  <!-- Claim Status List -->
  <div class="card" *ngIf="claimList.length > 0">
    <div class="card-body">
      <h5 class="mb-3">My Claim Status</h5>

      <ul class="list-group">
        <li class="list-group-item" *ngFor="let claim of claimList">
          <strong>{{ claim.description }}</strong><br />
          Status:
          <span class="badge bg-info text-dark">
            {{ claim.status }}
          </span><br />
          Date: {{ claim.date | date:'dd-MM-yyyy' }}
        </li>
      </ul>
    </div>
  </div>

  <!-- No Claims -->
  <div class="alert alert-info mt-3" *ngIf="claimList.length === 0 && !showError">
    No claims found yet.
  </div>

  <!-- Error -->
  <div class="alert alert-danger mt-3" *ngIf="showError">
    {{ errorMessage }}
  </div>
</div>
