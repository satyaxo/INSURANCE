<div class="container mt-4">
  <h2 class="text-center mb-4">Login</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onLogin()" class="needs-validation">
    <div class="form-group mb-3">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" />
    </div>

    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>

  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <div class="text-center mt-3">
    <button class="btn btn-link" (click)="registration()">Register here</button>
  </div>
</div>
