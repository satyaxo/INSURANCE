<div class="container mt-4">
  <h2 class="text-center mb-4">User Registration</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onRegister()" class="needs-validation">
    <div class="form-group mb-3">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" class="form-control" />
      <div *ngIf="itemForm.get('username')?.touched && itemForm.get('username')?.invalid" class="text-danger">
        Username is required.
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" class="form-control" />
      <div *ngIf="itemForm.get('email')?.touched && itemForm.get('email')?.invalid" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" />
      <div *ngIf="itemForm.get('password')?.touched && itemForm.get('password')?.invalid" class="text-danger">
        Password is required.
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="role">Role</label>
      <select id="role" formControlName="role" class="form-select">
        <option value="" disabled>Select Role</option>
        <option value="POLICYHOLDER">Policyholder</option>
        <option value="ADJUSTER">Adjuster</option>
        <option value="INVESTIGATOR">Investigator</option>
        <option value="UNDERWRITER">Underwriter</option>
      </select>
      <div *ngIf="itemForm.get('role')?.touched && itemForm.get('role')?.invalid" class="text-danger">
        Role is required.
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>

  <div *ngIf="showMessage" class="alert alert-info mt-3">
    {{ responseMessage }}
  </div>
</div>
