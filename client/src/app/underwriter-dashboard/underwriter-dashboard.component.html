<div class="container mt-4">

  <h2>Underwriter Dashboard</h2>

  <div *ngIf="showError" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="filteredClaims.length === 0 && !showError" class="alert alert-info">
    No claims assigned yet.
  </div>

  <div *ngFor="let claim of filteredClaims" class="claim-card border rounded p-3 mb-3">

    <h4>Claim #{{ claim.id }}</h4>

    <p><strong>Type:</strong> {{ claim.insuranceType || '-' }}</p>
    <p><strong>Policy Number:</strong> {{ claim.policyNumber || '-' }}</p>

    <p><strong>Description:</strong> {{ claim.description }}</p>
    <p><strong>Status:</strong> {{ claim.status }}</p>

    <!-- ✅ Show investigator report if DTO includes it -->
    <div *ngIf="claim.investigationReport" class="alert alert-secondary" style="white-space: pre-wrap;">
      <strong>Investigation Report:</strong><br />
      {{ claim.investigationReport }}
    </div>

    <button class="btn btn-primary btn-sm" (click)="editClaim(claim)">
      Edit / Review
    </button>

  </div>

</div>
