<div class="container mt-4">
  <h2 class="text-center mb-4">Update Claim</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label>Description</label>
      <input
        type="text"
        class="form-control"
        formControlName="description"
      />
    </div>

    <div class="mb-3">
      <label>Date</label>
      <input
        type="date"
        class="form-control"
        formControlName="date"
      />
    </div>

    <div class="mb-3">
      <label>Status</label>
      <select class="form-select" formControlName="status">
        <option value="" disabled>Select Status</option>

        <!-- ✅ Two options as you wanted -->
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="UNDER_PROGRESS">UNDER_PROGRESS</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      Update Claim
    </button>
  </form>

  <div *ngIf="showError" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <div *ngIf="showMessage" class="alert alert-success mt-3">
    {{ responseMessage }}
  </div>

  <h4 class="mt-4">Claims</h4>

  <div *ngIf="claimList.length === 0" class="alert alert-info">
    No claims available.
  </div>

  <ul class="list-group" *ngIf="claimList.length > 0">
    <li
      *ngFor="let claim of claimList"
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <span>
        <b>{{ claim.description }}</b> — {{ claim.status }}
        ({{ claim.date | date:'yyyy-MM-dd' }})
      </span>

      <button type="button" class="btn btn-sm btn-secondary" (click)="edit(claim)">
        Edit
      </button>
    </li>
  </ul>
</div>
