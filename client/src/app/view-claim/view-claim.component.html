<div class="container mt-4">
  <!-- Back Button -->
  <button class="btn btn-secondary mb-3" (click)="goBack()">
    ← Back
  </button>
  <!-- Card -->
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Claim Details</h4>
    </div>
    <div class="card-body" *ngIf="claim">
      <p><strong>Claim ID:</strong> #{{ claim.id }}</p>
      <p><strong>Description:</strong> {{ claim.description }}</p>
      <p>
        <strong>Status:</strong>
        <span class="badge"
          [ngClass]="{
            'bg-warning text-dark': claim.status === 'Pending',
            'bg-success': claim.status === 'Approved',
            'bg-danger': claim.status === 'Rejected'
          }">
          {{ claim.status }}
        </span>
      </p>
      <p><strong>Date Filed:</strong> {{ claim.dateFiled | date:'mediumDate' }}</p>

      <!-- ✅ DOCUMENTS SECTION — moved INSIDE card-body -->
      <hr>
      <h5>📎 Uploaded Documents</h5>

      <!-- No documents -->
      <p *ngIf="documents && documents.length === 0" class="text-muted">
        No documents uploaded for this claim.
      </p>

      <!-- Documents list -->
      <ul class="list-group" *ngIf="documents && documents.length > 0">
        <li
          *ngFor="let doc of documents"
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          📄 {{ doc.fileName }}
          <a                              
            [href]="doc.fileUrl"
            target="_blank"
            class="btn btn-sm btn-outline-primary"
          >
            View / Download
          </a>                            
        </li>
      </ul>
      <!-- ✅ END DOCUMENTS SECTION -->

    </div>
    <!-- Loading -->
    <div class="text-center p-4" *ngIf="!claim">
      <p class="text-muted">Loading claim details...</p>
    </div>
  </div>
</div>
